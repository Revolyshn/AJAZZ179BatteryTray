name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test AJ179BatteryTray.slnx -c Release

      - name: Check that the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = dotnet msbuild src/AJ179BatteryTray/AJ179BatteryTray.csproj -getProperty:Version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match project version $version"
          }

      - name: Publish both variants
        shell: pwsh
        run: |
          foreach ($variant in 'selfcontained', 'frameworkdependent') {
            $selfContained = ($variant -eq 'selfcontained').ToString().ToLowerInvariant()
            dotnet publish src/AJ179BatteryTray/AJ179BatteryTray.csproj -c Release `
              -p:SelfContained=$selfContained -o "artifacts/$variant"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item artifacts/selfcontained/AJ179BatteryTray.exe dist/AJ179BatteryTray.exe
          Copy-Item artifacts/frameworkdependent/AJ179BatteryTray.exe dist/AJ179BatteryTray-framework-dependent.exe
          Copy-Item src/AJ179BatteryTray/Assets/JetBrainsMono-OFL.txt dist/
          $sums = Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          }
          $sums | Set-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: AJ179BatteryTray
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: AJ179BatteryTray
          path: dist

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{p = ($2 == v)} p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "AJ179 Battery Tray $GITHUB_REF_NAME"
          --notes-file notes.md
